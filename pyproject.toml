[project]
name = "ieakaso"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Marcelo Foss de Oliveira", email = "marcelo.foss.rj@gmail.com" }
]
dependencies = [
    "fastapi[standard]>=0.139.2",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.43.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "prospector[with_everything]>=1.14.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"