[project]
name = "ieakaso"
version = "0.1.0"
description = "Ieakaso helps professionals find jobs that truly fit where they want their career to go next, not just any opening, the right one. It tracks applications, from first listing to offer, so nothing slips through, and guides you through interview prep along the way."
readme = "README.md"
authors = [
    { name = "Marcelo Foss de Oliveira", email = "marcelo.foss.rj@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pylatexenc>=2.11",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# PyMuPDF's SWIG bindings trip a Python 3.14 deprecation on import; not ours to fix.
filterwarnings = ["ignore:builtin type swig:DeprecationWarning", "ignore:builtin type Swig:DeprecationWarning"]
