[project]
name = "ieakaso"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcelo Foss de Oliveira", email = "marcelo.foss.rj@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ieakaso = "ieakaso:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
